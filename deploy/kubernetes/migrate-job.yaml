apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-migrate
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-migrate
    app.kubernetes.io/part-of: sentinel
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/gurnoorpannu/sentinel-service:latest
          imagePullPolicy: IfNotPresent
          command: ['node', 'packages/database/dist/migrate.js']
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
