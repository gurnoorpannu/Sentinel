apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-dashboard
    app.kubernetes.io/part-of: sentinel
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-dashboard
        app.kubernetes.io/part-of: sentinel
    spec:
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/gurnoorpannu/sentinel-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: SENTINEL_API_URL
              value: http://sentinel-api:4000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-dashboard
spec:
  selector:
    app.kubernetes.io/name: sentinel-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: http
