apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@MANAGED_POSTGRES_HOST:5432/sentinel
  METRICS_TOKEN: replace-with-a-random-token-at-least-16-characters
  OPERATOR_TOKEN: replace-with-a-random-token-at-least-32-characters
