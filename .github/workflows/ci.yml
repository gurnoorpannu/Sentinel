name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Smoke test worker benchmark
        run: npm run benchmark:worker
        env:
          BENCHMARK_DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test
          BENCHMARK_TASKS: 40
          BENCHMARK_CONCURRENCY: 4

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build service image
        run: docker build --target service --tag sentinel-service:test .
      - name: Build dashboard image
        run: docker build --target dashboard --tag sentinel-dashboard:test .
      - name: Verify non-root runtime
        run: |
          docker run --rm --entrypoint node sentinel-service:test \
            -e "if (process.getuid?.() === 0) process.exit(1)"
          docker run --rm --entrypoint node sentinel-dashboard:test \
            -e "if (process.getuid?.() === 0) process.exit(1)"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Smoke test runtime images
        run: |
          set -euo pipefail
          trap 'docker rm -f sentinel-api-smoke sentinel-dashboard-smoke >/dev/null 2>&1 || true' EXIT

          docker run --detach --name sentinel-api-smoke \
            --publish 4000:4000 \
            --env DATABASE_URL=postgresql://sentinel:sentinel@127.0.0.1:5432/unavailable \
            sentinel-service:test

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:4000/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs sentinel-api-smoke
              exit 1
            fi
            sleep 1
          done

          docker run --detach --name sentinel-dashboard-smoke \
            --publish 3000:3000 \
            --env SENTINEL_API_URL=http://127.0.0.1:4000 \
            sentinel-dashboard:test

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs sentinel-dashboard-smoke
              exit 1
            fi
            sleep 1
          done
